name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MAT_VERSION: 1.17.0.20260601

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache MAT
        id: mat
        uses: actions/cache@v4
        with:
          path: .tools
          key: mat-${{ env.MAT_VERSION }}-v2

      - name: Install MAT
        if: steps.mat.outputs.cache-hit != 'true'
        run: python3 tools/get_mat.py

      - name: Install zstd
        run: command -v zstd >/dev/null || sudo apt-get install -y zstd

      - name: Kotlin tests and shapes fat jar
        working-directory: experiments/shapes
        run: ./gradlew test fatJar

      - name: Python tests
        run: python3 -m unittest discover -s tests -t .

      - name: JavaScript tests
        run: node --test tests/js/*.test.mjs

      - name: Syntax checks
        run: |
          python3 -m py_compile backend/*.py backend/mat/*.py backend/machine/*.py backend/localstore/*.py tools/*.py
          for file in $(find web -name '*.js'); do
            node --input-type=module --check < "$file"
          done
