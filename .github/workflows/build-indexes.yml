name: build-indexes

# Builds Eclipse MAT index files for a heap dump published as a `run-*` release in the
# benchmark repo (default: kroune/feature-module-3000) and publishes them here as an
# `idx-<tag>` release (zstd-compressed *.index in a split tar + manifest.json).
# The release is created EARLY with just the tiny data.tar.gz (instant overview in the
# local UI); the heavy index parts are uploaded in parallel once compressed — the UI's
# index poller picks them up whenever they appear.
# The local UI (python3 -m backend.kernel) discovers these and downloads them on demand,
# so nobody ever runs the ~40 min MAT parse on their laptop.
#
# Triggered automatically by the benchmark workflows via repository_dispatch
# (event_type=build-indexes, client_payload: source_repo, release_tag), or manually.

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "repo with the run-* release"
        required: true
        default: "kroune/feature-module-3000"
      release_tag:
        description: "release tag, e.g. run-123 or run-45-base"
        required: true
  repository_dispatch:
    types: [build-indexes]

permissions:
  contents: write # publish idx-* releases

concurrency:
  group: idx-${{ github.event.client_payload.release_tag || inputs.release_tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo }}
  TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
  MAT_VERSION: 1.17.0.20260601

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 21 (MAT 1.17 requires 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache MAT
        id: mat
        uses: actions/cache@v4
        with:
          path: .tools
          key: mat-${{ env.MAT_VERSION }}-v2

      - name: Install MAT
        if: steps.mat.outputs.cache-hit != 'true'
        run: python3 tools/get_mat.py

      - name: Install zstd
        run: command -v zstd >/dev/null || sudo apt-get install -y zstd

      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^run-([A-Za-z]+-)*[0-9]+(-(base|candidate))?$ ]] || { echo "bad release_tag: $TAG"; exit 1; }
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad source_repo: $SOURCE_REPO"; exit 1; }

      - name: Download heap dump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          gh release view "$TAG" -R "$SOURCE_REPO" --json name,assets --jq '.assets[].name' > assets.txt
          # PREFER the stripped dump (primitive arrays zeroed in place — offsets
          # preserved, so indexes are valid for both variants; it is simply the
          # smaller, canonical download). Old releases only carry the full dump.
          if grep -q '^daemon\.stripped\.hprof\.gz$' assets.txt; then
            gh release download "$TAG" -R "$SOURCE_REPO" -p daemon.stripped.hprof.gz --clobber
            gzip -dc daemon.stripped.hprof.gz > daemon.hprof
          elif grep -q '^daemon\.hprof\.gz\.part-' assets.txt; then
            # parts are independent assets — fetch them in parallel
            grep '^daemon\.hprof\.gz\.part-' assets.txt \
              | xargs -P4 -n1 -I{} gh release download "$TAG" -R "$SOURCE_REPO" -p {} --clobber
            cat daemon.hprof.gz.part-* | gzip -dc > daemon.hprof
          elif grep -q '^daemon\.hprof\.gz$' assets.txt; then
            gh release download "$TAG" -R "$SOURCE_REPO" -p daemon.hprof.gz --clobber
            gzip -dc daemon.hprof.gz > daemon.hprof
          else
            echo "release $SOURCE_REPO@$TAG carries no daemon.hprof.gz — nothing to index"
            exit 1
          fi
          ls -lh daemon.hprof

      # First MAT query against a dump parses it and writes the full *.index set;
      # the histogram doubles as the parse smoke test (and ships in the tar, so the
      # local bootstrap can skip re-running it).
      - name: MAT parse (build indexes + histogram)
        run: |
          set -euo pipefail
          cd work
          ../.tools/mat/ParseHeapDump.sh -data /tmp/mat-ws daemon.hprof \
            -command=histogram -format=csv -limit=2000000 -filename_suffix=ci \
            org.eclipse.mat.api:query
          ls -lh daemon.*.index daemon.threads
          mkdir -p data
          unzip -o -j daemon_ci.zip 'pages/*.csv' -d /tmp/hist$$
          mv /tmp/hist$$/*.csv data/histogram.csv
          rm daemon_ci.zip
          head -3 data/histogram.csv

      # Cheap global extracts (dominators + meta) — the parse is done, so each query
      # takes ~1 min. Shipped as data.tar.gz (a few MB): the laptop's overview UI
      # (classes/treemap/compare) is usable seconds after the build ends, while the
      # heavy dump + indexes download in the background.
      - name: Bootstrap data extracts (dominators)
        env:
          MAT_JOBS: "1" # each MAT JVM may grow to -Xmx10g — serial on a 16 GB runner
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys, os
          sys.path.insert(0, os.getcwd())
          from backend import ci
          ci.bootstrap(os.path.abspath("work/daemon.hprof"), "x",
                       os.path.abspath("work"))
          EOF
          ls -lh work/data/

      # The release is created HERE, right after the data extracts, with just the
      # tiny data.tar.gz: the heap-report UI picks it up immediately (overview
      # viz works while the heavy indexes are still being compressed/uploaded —
      # its poller fetches the index parts once they appear below).
      - name: Publish data bundle (early overview)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd work
          tar -czf data.tar.gz data
          title=$(gh release view "$TAG" -R "$SOURCE_REPO" --json name --jq .name)
          echo "title=$title" >> "$GITHUB_ENV"
          gh release delete "idx-$TAG" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "idx-$TAG" -R '${{ github.repository }}' \
            --title "MAT indexes — $SOURCE_REPO $TAG" \
            --notes "Pre-built Eclipse MAT indexes for the daemon heap dump of [\`$TAG\`](${{ github.server_url }}/$SOURCE_REPO/releases/tag/$TAG). \`data.tar.gz\` = histogram + dominators (instant overview); \`indexes.tar.part-*\` = compacted MAT indexes for per-class analysis (may still be uploading — the heap-report UI picks them up automatically). Downloaded automatically by the heap-report UI. $title" \
            data.tar.gz

      - name: Compress indexes (zstd)
        run: python3 -c "from backend.ci import compact; compact('work')"

      - name: Publish index parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd work
          tar -cf indexes.tar ./*.index.zst ./*.threads INDEXES-COMPACTED.txt
          split -b 1900m indexes.tar indexes.tar.part-
          # keep indexes.tar: the S3 upload below ships it (zstd-compressed)
          # as ONE unsplit object — S3 has no 2 GiB asset cap
          tar_bytes=$(du -cb indexes.tar.part-* | tail -1 | cut -f1)
          data_bytes=$(stat -c%s data.tar.gz)
          gver=$(echo "$title" | grep -oE 'Gradle [^ ,—]+' | head -1 | sed 's/Gradle //')
          xmx=$(echo "$title" | grep -oE 'daemon [^ ,—]+' | head -1 | sed 's/daemon //')
          # per-member sizes of the index tar — heap-report validates the
          # extracted set against this before marking a dump ready
          files_json=$(stat -c '%n %s' ./*.index.zst ./*.threads INDEXES-COMPACTED.txt \
            | jq -Rn '[inputs | split(" ") | {key: (.[0] | sub("^\\./"; "")), value: (.[1] | tonumber)}] | from_entries')
          cat > manifest.json <<EOF
          {
            "source_repo": "$SOURCE_REPO",
            "source_tag": "$TAG",
            "source_title": $(jq -Rn --arg t "$title" '$t'),
            "gradle_version": "$gver",
            "daemon_xmx": "$xmx",
            "mat_version": "$MAT_VERSION",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "index_bytes": $tar_bytes,
            "data_bytes": $data_bytes,
            "files": $files_json
          }
          EOF
          # independent assets — upload in parallel onto the existing release
          ls indexes.tar.part-* manifest.json \
            | xargs -P4 -n1 gh release upload "idx-$TAG" -R '${{ github.repository }}' --clobber
          {
            echo "## MAT indexes published"
            echo
            echo "- source: \`$SOURCE_REPO\` release \`$TAG\` — $title"
            echo "- indexes.tar: $(numfmt --to=iec $tar_bytes) in $(ls indexes.tar.part-* | wc -l) parts + data.tar.gz ($(numfmt --to=iec $data_bytes))"
            echo "- release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/idx-$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      # The user's local fast lane: the same artifacts as SINGLE objects (no
      # 2 GiB splitting on S3) in the private SeaweedFS — the heap-report
      # server prefers S3 over GitHub for downloads. NON-FATAL: the GitHub
      # release stays the source of truth.
      - name: Upload to S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_MAX_ATTEMPTS: "10"  # transient 503s under multipart load
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          cd work
          aws configure set default.s3.max_concurrent_requests 16
          aws configure set default.s3.multipart_threshold 16MB
          aws configure set default.s3.multipart_chunksize 16MB
          zstd -q -T0 -f indexes.tar   # the unsplit tar, truthfully named
          for f in data.tar.gz indexes.tar.zst manifest.json; do
            bash ../tools/s3_upload.sh "$f" "s3://$S3_BUCKET/idx-$TAG/$f"
          done
